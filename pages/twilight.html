<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NovaGG</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="icon" type="image/png" href="media/favicon.png">

    <script defer src="https://cdn.jsdelivr.net/npm/@alpinejs/intersect@3.x.x/dist/cdn.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
      /* --- CORE VARIABLES --- */
      :root {
        /* Light Theme (Default) */
        --bg-color: #e0e5ec;
        --text-color: #4a5568;
        --primary-color: #4c68ff;
        --secondary-bg: #e0e5ec;
        --danger-color: #ff4c4c;

        /* Neumorphic Shadows (Light) */
        --shadow-outer: 9px 9px 16px rgb(163,177,198,0.6), -9px -9px 16px rgba(255,255,255, 0.5);
        --shadow-inner: inset 6px 6px 10px 0 rgba(163,177,198, 0.7), inset -6px -6px 10px 0 rgba(255,255,255, 0.8);

        /* Button specific */
        --btn-shadow: 6px 6px 10px 0 rgba(163,177,198, 0.7), -6px -6px 10px 0 rgba(255,255,255, 0.8);
        --btn-shadow-active: inset 4px 4px 8px 0 rgba(163,177,198, 0.7), inset -4px -4px 8px 0 rgba(255,255,255, 0.8);

        --border-radius: 20px;
        --font-stack: 'Inter', sans-serif;
      }

      /* Dark Mode Overrides */
      [data-theme="dark"] {
        --bg-color: #212529;
        --text-color: #e2e8f0;
        --primary-color: #6c80ff;
        --secondary-bg: #212529;
        --danger-color: #ff6b6b;

        /* Neumorphic Shadows (Dark) */
        --shadow-outer: 7px 7px 15px rgba(0,0,0,0.5), -7px -7px 15px rgba(255,255,255,0.05);
        --shadow-inner: inset 5px 5px 10px rgba(0,0,0,0.5), inset -5px -5px 10px rgba(255,255,255,0.05);

        --btn-shadow: 6px 6px 10px rgba(0,0,0,0.5), -6px -6px 10px rgba(255,255,255,0.05);
        --btn-shadow-active: inset 4px 4px 8px rgba(0,0,0,0.5), inset -4px -4px 8px rgba(255,255,255,0.05);
      }

      body {
        background-color: var(--bg-color);
        color: var(--text-color);
        font-family: var(--font-stack);
        transition: background-color 0.1s ease, color 0.1s ease;
      }

      /* --- NEUMORPHIC UTILITY CLASSES --- */

      .neu-flat {
        background: var(--bg-color);
        box-shadow: var(--shadow-outer);
        border-radius: var(--border-radius);
        border: 1px solid transparent;
        transition: all 0.3s ease;
      }

      .neu-flat:hover {
        transform: translateY(-3px);
      }

      .neu-pressed {
        background: var(--bg-color);
        box-shadow: var(--shadow-inner);
        border-radius: var(--border-radius);
        border: none;
        color: var(--text-color);
      }

      /* Standard Button */
      .neu-btn {
        width: 45px;
        height: 45px;
        border-radius: 50%;
        background: var(--bg-color);
        box-shadow: var(--btn-shadow);
        display: flex; align-items: center; justify-content: center;
        flex-shrink: 0;
        aspect-ratio: 1/1;
        color: var(--primary-color);
        transition: all 0.2s ease;
        cursor: pointer;
        border: none; outline: none;
      }

      /* Mini Button for Cards */
      .neu-btn-sm {
        width: 32px;
        height: 32px;
        border-radius: 50%;
        background: var(--bg-color);
        box-shadow: var(--btn-shadow);
        display: flex; align-items: center; justify-content: center;
        flex-shrink: 0;
        aspect-ratio: 1/1;
        font-size: 0.8rem;
        color: var(--text-color);
        transition: all 0.2s ease;
        cursor: pointer;
        border: none; outline: none;
        z-index: 10;
      }

      .neu-btn:active, .neu-btn.active, .neu-btn-sm:active {
        box-shadow: var(--btn-shadow-active);
        transform: scale(0.95);
      }

      .neu-btn-sm.active-fav {
        color: #e91e63; /* Pink for favorites */
        box-shadow: var(--btn-shadow-active);
      }

      .neu-btn-sm.danger:hover {
        color: var(--danger-color);
      }

      select {
        background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%2224%22%20height%3D%2224%22%20viewBox%3D%220%200%2024%2024%22%20fill%3D%22none%22%20stroke%3D%22%234c68ff%22%20stroke-width%3D%222%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%3E%3Cpolyline%20points%3D%226%209%2012%2015%2018%209%22%3E%3C%2Fpolyline%3E%3C%2Fsvg%3E");
        background-repeat: no-repeat;
        background-position: right 1rem center;
        background-size: 1em;
      }

      /* Popup System */
      .popup-overlay {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(0,0,0,0.8);
        z-index: 50;
        backdrop-filter: blur(5px);
        display: flex; align-items: center; justify-content: center;
      }

      .popup-content {
        width: 95%; height: 90%;
        background: var(--bg-color);
        border-radius: var(--border-radius);
        overflow: hidden;
        display: flex; flex-direction: column;
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      }

      .loader {
        border: 4px solid transparent;
        border-top: 4px solid var(--primary-color);
        border-radius: 50%;
        width: 40px; height: 40px;
        animation: spin 1s linear infinite;
        margin: 0 auto;
      }
      @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
  </head>

  <body class="min-h-screen">
    <div x-data="gamesApp()" x-init="init()">

      <header class="p-8 relative">
        <div class="flex flex-col items-center justify-center">
            <div class="neu-flat p-4 rounded-full mb-4" style="border-radius: 50%;">
                <img src="./media/favicon.png" alt="Logo" class="w-12 h-12" />
            </div>
            <h1 class="text-4xl font-bold tracking-tight text-center">
            Nova<span style="color: var(--primary-color)">GG</span>
            </h1>
            <p class="mt-2 text-sm opacity-60 font-medium">Twilight Edition</p>
        </div>
 <!--       <button @click="toggleTheme()" class="neu-btn absolute top-8 right-8" title="Toggle theme">
          <i class="fa-solid" :class="theme === 'light' ? 'fa-moon' : 'fa-sun'"></i>-->
        </button>
      </header>

      <main class="container mx-auto px-6 pb-12 max-w-7xl">
        <div class="mb-10 flex flex-col md:flex-row gap-6 items-center">
          <div class="flex-1 w-full">
            <input
              type="text"
              x-model="searchQuery"
              :placeholder="searchPlaceholder"
              class="neu-pressed w-full px-6 py-4 outline-none transition text-lg"
            />
          </div>

          <div class="w-full md:w-64">
            <select
              x-model="filterCategory"
              class="neu-flat w-full px-6 py-4 outline-none cursor-pointer appearance-none font-medium"
            >
              <option value="all">All Games</option>
              <option value="recent">🕒 Recent Plays</option>
              <option value="favorites">❤️ Favorites</option>
            </select>
          </div>
        </div>

        <div class="text-center mb-8 opacity-50 text-sm font-semibold tracking-wide uppercase">
            <span x-text="filteredGames.length"></span> titles available
        </div>

        <div x-show="!loading && filteredGames.length === 0" class="text-center py-20">
            <div class="neu-flat inline-flex p-6 rounded-full text-4xl opacity-40 mb-4" style="border-radius: 50%">
                <i class="fa-solid fa-ghost"></i>
            </div>
            <p class="opacity-60 font-medium" x-text="getEmptyMessage()"></p>
        </div>

        <div x-show="displayedGames.length > 0" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 gap-8">
          <template x-for="(game, index) in displayedGames" :key="game.name + index">

            <div x-data="{ shown: false }"
                 x-intersect:enter.margin.200px="shown = true"
                 x-intersect:leave.margin.200px="shown = false"
                 class="neu-flat p-4 cursor-pointer flex flex-col items-center group relative"
                 @click="openGame(game)">

              <div class="absolute top-2 right-2 flex gap-2 z-20">
                <button
                    @click.stop="toggleFavorite(game)"
                    class="neu-btn-sm"
                    :class="isFavorite(game) ? 'active-fav' : ''"
                    title="Add to Favorites"
                >
                    <i class="fa-heart" :class="isFavorite(game) ? 'fa-solid' : 'fa-regular'"></i>
                </button>

                <template x-if="filterCategory === 'recent'">
                    <button
                        @click.stop="removeRecent(game)"
                        class="neu-btn-sm danger"
                        title="Remove from Recent"
                    >
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                </template>
              </div>

              <div class="w-full aspect-square rounded-2xl overflow-hidden mb-4 relative shadow-[inset_0_2px_4px_rgba(0,0,0,0.1)] bg-[#1a1c23]">

                <template x-if="shown">
                  <img
                    :src="getGameImage(game)"
                    @error="$el.src = 'https://tse2.mm.bing.net/th?q=' + encodeURIComponent(game.name + ' game logo')"
                    :alt="game.name"
                    loading="lazy"
                    class="w-full h-full object-cover transition duration-500 group-hover:scale-110"
                  />
                </template>
              </div>

              <p class="text-sm font-semibold text-center truncate w-full px-2" x-text="game.name"></p>
            </div>
          </template>
        </div>

        <div x-show="displayedGames.length < filteredGames.length"
             x-intersect="loadMore()"
             class="w-full text-center py-12 mt-8 opacity-60 font-medium">
             <div class="loader mb-4"></div>
             Loading more games...
        </div>
      </main>

      <div class="popup-overlay" x-show="popupOpen" x-cloak @click.self="closePopup()">
        <div class="popup-content">
            <div class="flex items-center justify-between px-6 py-4 bg-[var(--bg-color)] border-b border-[rgba(0,0,0,0.05)]">
                <div style="width: 140px"></div>

                <h2 class="text-lg font-bold truncate text-center flex-1" x-text="currentGame?.name"></h2>

                <div class="flex gap-4 w-[140px] justify-end">
                    <button class="neu-btn" @click="refreshGame()" title="Refresh">
                        <i class="fa-solid fa-rotate-right text-sm"></i>
                    </button>
                    <button class="neu-btn" @click="fullscreenPopup()" title="Fullscreen">
                        <i class="fa-solid fa-expand text-sm"></i>
                    </button>
                    <button class="neu-btn text-red-500" @click="closePopup()" title="Close">
                        <i class="fa-solid fa-times text-lg"></i>
                    </button>
                </div>
            </div>

            <div class="relative flex-1 bg-black w-full h-full">
                <div x-show="gameLoading" class="absolute inset-0 flex items-center justify-center">
                    <div class="loader border-t-blue-500"></div>
                </div>
                <iframe x-ref="gameFrame" class="w-full h-full border-none block" allowfullscreen></iframe>
            </div>
        </div>
      </div>

    </div>

    <!-- Hardcoded game library. No JSON fetch, no proxy. -->
    <script src="../games2/Jsonfile.json"></script>

    <script>
      function gamesApp() {
        return {
          allGames: [],
          recentGames: [],
          favoriteGames: [],
          filteredGames: [],
          displayLimit: 24, // Starting limit for infinite scroll

          searchQuery: "",
          filterCategory: "all",
          searchPlaceholder: "Loading...",
          loading: true,
          popupOpen: false,
          gameLoading: false,
          currentGame: null,
          theme: 'light',

          // Computes just the slice of games to display to avoid DOM overloading
          get displayedGames() {
              return this.filteredGames.slice(0, this.displayLimit);
          },

          init() {
            this.theme = localStorage.getItem('theme') || 'light';
            document.documentElement.setAttribute('data-theme', this.theme);

            this.$watch('filterCategory', () => {
                this.applyFilters();
            });
            this.$watch('searchQuery', () => {
                this.applyFilters();
            });

            const savedRecents = localStorage.getItem('recentGames');
            if (savedRecents) this.recentGames = JSON.parse(savedRecents);

            const savedFavs = localStorage.getItem('favoriteGames');
            if (savedFavs) this.favoriteGames = JSON.parse(savedFavs);

            // Games come straight from the hardcoded GAMES_LIST array (games_array.js)
            this.allGames = [...GAMES_LIST].sort((a, b) => a.name.localeCompare(b.name));

            this.applyFilters();
            this.loading = false;
          },

          toggleTheme() {
            this.theme = this.theme === 'light' ? 'dark' : 'light';
            localStorage.setItem('theme', this.theme);
            document.documentElement.setAttribute('data-theme', this.theme);
          },

          isFavorite(game) {
            return this.favoriteGames.some(g => g.name === game.name);
          },

          toggleFavorite(game) {
            if (this.isFavorite(game)) {
                this.favoriteGames = this.favoriteGames.filter(g => g.name !== game.name);
            } else {
                this.favoriteGames.push(game);
            }
            localStorage.setItem('favoriteGames', JSON.stringify(this.favoriteGames));

            if (this.filterCategory === 'favorites') {
                this.applyFilters();
            }
          },

          removeRecent(game) {
            this.recentGames = this.recentGames.filter(g => g.name !== game.name);
            localStorage.setItem('recentGames', JSON.stringify(this.recentGames));
            this.applyFilters();
          },

          applyFilters() {
            const query = this.searchQuery.toLowerCase();
            let sourceList = [];

            if (this.filterCategory === 'all') {
                sourceList = this.allGames;
            } else if (this.filterCategory === 'recent') {
                sourceList = this.recentGames;
            } else if (this.filterCategory === 'favorites') {
                sourceList = this.favoriteGames;
            }

            this.filteredGames = sourceList.filter(g => g.name.toLowerCase().includes(query));

            // Reset pagination limit anytime filters change
            this.displayLimit = 24;
            this.searchPlaceholder = `Search ${sourceList.length} games...`;
          },

          loadMore() {
            if (this.displayLimit < this.filteredGames.length) {
                setTimeout(() => {
                    this.displayLimit += 24;
                }, 200);
            }
          },

          getEmptyMessage() {
            if (this.filterCategory === 'recent') return "You haven't played any games yet!";
            if (this.filterCategory === 'favorites') return "No favorites yet. Click the heart on a game to add it!";
            return "No games found.";
          },

          // Thumbnails are just a Bing image search for the game's name - no local
          // image assets and no JSON metadata are used.
          getGameImage(game) {
            return `https://tse2.mm.bing.net/th?q=${encodeURIComponent(game.name + ' "game" icon')}`;
          },

          openGame(game) {
            this.currentGame = game;

            this.recentGames = this.recentGames.filter(g => g.name !== game.name);
            this.recentGames.unshift(game);
            if (this.recentGames.length > 50) this.recentGames.pop();
            localStorage.setItem('recentGames', JSON.stringify(this.recentGames));

            this.popupOpen = true;
            this.gameLoading = true;

            // Load the game's URL directly into the iframe. No proxy fetching or
            // HTML rewriting - the iframe just navigates straight to game.url.
            this.$nextTick(() => {
              const frame = this.$refs.gameFrame;
              frame.onload = () => { this.gameLoading = false; };
              frame.src = game.url;
            });
          },

          refreshGame() {
            this.gameLoading = true;
            const frame = this.$refs.gameFrame;
            frame.src = this.currentGame.url;
          },

          closePopup() {
            this.popupOpen = false;
            this.$refs.gameFrame.src = "about:blank";
          },

          fullscreenPopup() {
            this.$refs.gameFrame.requestFullscreen?.();
          }
        }
      }
    </script>
  </body>
</html>
